
<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ================= STYLES ================= -->

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea 0%,
                    #764ba2 100%
                );

            min-height: 100vh;

            padding: 20px;
        }


        /* ================= CONTAINER ================= */

        .container {

            max-width: 1200px;

            margin: 0 auto;

            background:
                rgba(255, 255, 255, 0.95);

            border-radius: 20px;

            box-shadow:
                0 20px 40px
                rgba(0, 0, 0, 0.1);

            overflow: hidden;
        }


        /* ================= HEADER ================= */

        .header {

            background:
                linear-gradient(
                    135deg,
                    #4facfe 0%,
                    #00f2fe 100%
                );

            color: white;

            text-align: center;

            padding: 30px 20px;
        }


        /*
            W.TRACER BRAND
            Logo is now INSIDE the title.
        */

        .brand {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-bottom: 10px;

            position: relative;
        }


        /* ================= LOGO ================= */

        .brand-logo {

            width: 48px;

            height: 48px;

            min-width: 48px;

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.95);

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 6px 18px
                rgba(0, 0, 0, 0.18);

            position: relative;

            overflow: hidden;

            transform: rotate(-3deg);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .brand:hover .brand-logo {

            transform:
                rotate(0deg)
                scale(1.06);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.25);
        }


        /*
            Custom W logo
        */

        .brand-logo svg {

            width: 34px;

            height: 34px;
        }


        /* ================= TITLE ================= */

        .brand h1 {

            font-size: 2.5rem;

            line-height: 1;

            font-weight: 700;

            letter-spacing: -1px;

            text-shadow:
                0 2px 4px
                rgba(0, 0, 0, 0.3);
        }


        .brand h1 span {

            font-weight: 400;

            opacity: 0.95;
        }


        .header p {

            font-size: 1.1rem;

            opacity: 0.9;

            margin-top: 4px;
        }


        /* ================= CONTROLS ================= */

        .controls {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px 30px;

            background: #f8f9fa;

            border-bottom:
                1px solid #e9ecef;

            flex-wrap: wrap;

            gap: 15px;
        }


        .sort-filter {

            display: flex;

            gap: 15px;

            align-items: center;
        }


        .control-group {

            display: flex;

            flex-direction: column;

            gap: 5px;
        }


        .control-group label {

            font-weight: 600;

            color: #495057;

            font-size: 0.9rem;
        }


        select,
        input[type="text"],
        input[type="date"] {

            padding: 10px 15px;

            border:
                2px solid #e9ecef;

            border-radius: 10px;

            font-size: 1rem;

            transition:
                all 0.3s ease;

            min-width: 150px;
        }


        select:focus,
        input:focus,
        textarea:focus {

            outline: none;

            border-color: #4facfe;

            box-shadow:
                0 0 0 3px
                rgba(79, 172, 254, 0.1);
        }


        /* ================= MAIN CONTENT ================= */

        .main-content {

            padding: 30px;

            display: grid;

            grid-template-columns:
                1fr 2fr;

            gap: 30px;

            min-height: 600px;
        }


        /* ================= ADD TASK ================= */

        .add-task-section {

            background:
                linear-gradient(
                    135deg,
                    #a8edea 0%,
                    #fed6e3 100%
                );

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.1);
        }


        .add-task-section h2 {

            color: #2c3e50;

            margin-bottom: 20px;

            font-size: 1.5rem;
        }


        .task-form {

            display: flex;

            flex-direction: column;

            gap: 15px;
        }


        .task-form textarea {

            resize: vertical;

            padding: 12px;

            border:
                2px solid #e9ecef;

            border-radius: 10px;

            font-family: inherit;

            font-size: 1rem;
        }


        .priority-select {

            padding: 12px;

            border-radius: 10px;

            border:
                2px solid #e9ecef;

            font-size: 1rem;
        }


        /* ================= ADD BUTTON ================= */

        .add-btn {

            background:
                linear-gradient(
                    135deg,
                    #667eea 0%,
                    #764ba2 100%
                );

            color: white;

            border: none;

            padding: 15px 25px;

            border-radius: 10px;

            font-size: 1.1rem;

            font-weight: 600;

            cursor: pointer;

            transition:
                all 0.3s ease;

            box-shadow:
                0 5px 15px
                rgba(102, 126, 234, 0.4);
        }


        .add-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(102, 126, 234, 0.6);
        }


        /* ================= TASK SECTION ================= */

        .tasks-section {

            background: #ffffff;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.05);
        }


        .tasks-section h2 {

            color: #2c3e50;

            margin-bottom: 20px;

            font-size: 1.5rem;
        }


        /* ================= TASK ITEM ================= */

        .task-item {

            background:
                linear-gradient(
                    135deg,
                    #ffecd2 0%,
                    #fcb69f 100%
                );

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 15px;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.08);

            transition:
                all 0.3s ease;

            border-left: 5px solid;
        }


        .task-item:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.15);
        }


        .task-item.high {

            border-left-color: #e74c3c;

            background:
                linear-gradient(
                    135deg,
                    #ffcccb 0%,
                    #ffb3ba 100%
                );
        }


        .task-item.medium {

            border-left-color: #f39c12;

            background:
                linear-gradient(
                    135deg,
                    #ffe4b5 0%,
                    #ffd700 100%
                );
        }


        .task-item.low {

            border-left-color: #27ae60;

            background:
                linear-gradient(
                    135deg,
                    #c8e6c9 0%,
                    #a5d6a7 100%
                );
        }


        .task-header {

            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            margin-bottom: 10px;

            gap: 15px;
        }


        .task-title {

            font-size: 1.2rem;

            font-weight: 600;

            color: #2c3e50;

            flex: 1;
        }


        .task-actions {

            display: flex;

            gap: 10px;
        }


        .task-btn {

            padding: 8px 12px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 0.9rem;

            font-weight: 500;

            transition:
                all 0.3s ease;
        }


        .complete-btn {

            background: #27ae60;

            color: white;
        }


        .complete-btn:hover {

            background: #219a52;

            transform:
                scale(1.05);
        }


        .delete-btn {

            background: #e74c3c;

            color: white;
        }


        .delete-btn:hover {

            background: #c0392b;

            transform:
                scale(1.05);
        }


        /* ================= TASK META ================= */

        .task-meta {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-top: 10px;

            font-size: 0.9rem;

            color: #7f8c8d;

            gap: 10px;
        }


        .priority-badge {

            padding: 4px 12px;

            border-radius: 20px;

            color: white;

            font-weight: 600;

            font-size: 0.8rem;
        }


        .priority-badge.high {

            background: #e74c3c;
        }


        .priority-badge.medium {

            background: #f39c12;
        }


        .priority-badge.low {

            background: #27ae60;
        }


        .task-item.completed {

            opacity: 0.7;

            text-decoration:
                line-through;
        }


        /* ================= EMPTY TASK ================= */

        .no-tasks {

            text-align: center;

            color: #7f8c8d;

            font-size: 1.1rem;

            margin-top: 50px;
        }


        /* ================= STATS ================= */

        .stats {

            display: flex;

            justify-content:
                space-around;

            background:
                linear-gradient(
                    135deg,
                    #667eea 0%,
                    #764ba2 100%
                );

            color: white;

            padding: 20px;

            margin-top: 20px;

            border-radius: 10px;
        }


        .stat-item {

            text-align: center;
        }


        .stat-number {

            font-size: 2rem;

            font-weight: bold;

            display: block;
        }


        .stat-label {

            font-size: 0.9rem;

            opacity: 0.9;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            body {

                padding: 10px;
            }


            .main-content {

                grid-template-columns: 1fr;

                gap: 20px;

                padding: 20px;
            }


            .controls {

                flex-direction: column;

                align-items: stretch;
            }


            .sort-filter {

                flex-direction: column;

                align-items: stretch;
            }


            .brand h1 {

                font-size: 2rem;
            }


            .brand-logo {

                width: 42px;

                height: 42px;

                min-width: 42px;
            }


            .brand-logo svg {

                width: 29px;

                height: 29px;
            }


            .task-header {

                flex-direction: column;
            }


            .task-actions {

                width: 100%;
            }


            .task-btn {

                flex: 1;
            }


            .task-meta {

                flex-direction: column;

                align-items: flex-start;
            }

        }

    </style>

</head>


<body>

    <div class="container">


        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="brand">

                <!-- W.TRACER LOGO -->

                <div
                    class="brand-logo"
                    aria-label="W.Tracer logo"
                >

                    <svg
                        viewBox="0 0 100 100"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <!-- W symbol -->

                        <path
                            d="
                                M18 25
                                L30 72
                                L50 45
                                L70 72
                                L82 25
                            "
                            fill="none"
                            stroke="#667eea"
                            stroke-width="10"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                        <!-- Small tracking dot -->

                        <circle
                            cx="82"
                            cy="25"
                            r="6"
                            fill="#00c6ff"
                        />

                    </svg>

                </div>


                <!-- TITLE -->

                <h1>
                    W<span>.Tracer</span>
                </h1>

            </div>


            <p>
                Tracking work with style and priority
            </p>

        </header>


        <!-- ================= CONTROLS ================= -->

        <section class="controls">

            <div class="sort-filter">


                <div class="control-group">

                    <label for="sortBy">
                        Sort By:
                    </label>

                    <select id="sortBy">

                        <option value="date">
                            Date Added
                        </option>

                        <option value="priority">
                            Priority
                        </option>

                        <option value="title">
                            Title
                        </option>

                        <option value="dueDate">
                            Due Date
                        </option>

                    </select>

                </div>


                <div class="control-group">

                    <label for="filterPriority">
                        Filter Priority:
                    </label>

                    <select id="filterPriority">

                        <option value="all">
                            All Priorities
                        </option>

                        <option value="high">
                            High Priority
                        </option>

                        <option value="medium">
                            Medium Priority
                        </option>

                        <option value="low">
                            Low Priority
                        </option>

                    </select>

                </div>


            </div>

        </section>


        <!-- ================= MAIN CONTENT ================= -->

        <main class="main-content">


            <!-- ================= ADD TASK ================= -->

            <section class="add-task-section">

                <h2>
                    ✨ Add New Task
                </h2>


                <div class="task-form">


                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Enter task title..."
                        maxlength="100"
                        autocomplete="off"
                    >


                    <textarea
                        id="taskDescription"
                        placeholder="Task description (optional)..."
                        rows="3"
                    ></textarea>


                    <select
                        id="taskPriority"
                        class="priority-select"
                    >

                        <option value="medium">
                            Medium Priority
                        </option>

                        <option value="high">
                            High Priority
                        </option>

                        <option value="low">
                            Low Priority
                        </option>

                    </select>


                    <input
                        type="date"
                        id="taskDueDate"
                    >


                    <button
                        class="add-btn"
                        onclick="addTask()"
                    >

                        ➕ Add Task

                    </button>


                </div>


                <!-- ================= STATS ================= -->

                <div class="stats">


                    <div class="stat-item">

                        <span
                            class="stat-number"
                            id="totalTasks"
                        >
                            0
                        </span>

                        <span class="stat-label">
                            Total Tasks
                        </span>

                    </div>


                    <div class="stat-item">

                        <span
                            class="stat-number"
                            id="completedTasks"
                        >
                            0
                        </span>

                        <span class="stat-label">
                            Completed
                        </span>

                    </div>


                    <div class="stat-item">

                        <span
                            class="stat-number"
                            id="pendingTasks"
                        >
                            0
                        </span>

                        <span class="stat-label">
                            Pending
                        </span>

                    </div>


                </div>

            </section>


            <!-- ================= TASK LIST ================= -->

            <section class="tasks-section">

                <h2>
                    📋 Your Tasks
                </h2>


                <div id="tasksList">

                    <div class="no-tasks">

                        No tasks yet.
                        Add your first task to get started! 🚀

                    </div>

                </div>

            </section>


        </main>


    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        class TodoApp {

            constructor() {

                this.tasks =
                    JSON.parse(
                        localStorage.getItem(
                            'todoTasks'
                        )
                    ) || [];


                this.currentId =
                    parseInt(
                        localStorage.getItem(
                            'todoCurrentId'
                        )
                    ) || 1;


                this.init();

            }


            init() {

                this.renderTasks();

                this.updateStats();

                this.bindEvents();

            }


            bindEvents() {

                document
                    .getElementById('sortBy')
                    .addEventListener(
                        'change',
                        () => this.renderTasks()
                    );


                document
                    .getElementById('filterPriority')
                    .addEventListener(
                        'change',
                        () => this.renderTasks()
                    );


                document
                    .getElementById('taskTitle')
                    .addEventListener(
                        'keypress',
                        (e) => {

                            if (e.key === 'Enter') {

                                this.addTask();

                            }

                        }
                    );

            }


            addTask() {

                const title =
                    document
                        .getElementById('taskTitle')
                        .value
                        .trim();


                const description =
                    document
                        .getElementById('taskDescription')
                        .value
                        .trim();


                const priority =
                    document
                        .getElementById('taskPriority')
                        .value;


                const dueDate =
                    document
                        .getElementById('taskDueDate')
                        .value;


                if (!title) {

                    alert(
                        'Please enter a task title!'
                    );

                    return;

                }


                const task = {

                    id: this.currentId++,

                    title: title,

                    description: description,

                    priority: priority,

                    dueDate: dueDate,

                    completed: false,

                    createdAt:
                        new Date().toISOString()

                };


                this.tasks.push(task);


                this.saveToStorage();


                this.clearForm();


                this.renderTasks();


                this.updateStats();


                this.showFeedback(
                    'Task added successfully! ✅'
                );

            }


            deleteTask(id) {

                if (
                    confirm(
                        'Are you sure you want to delete this task?'
                    )
                ) {

                    this.tasks =
                        this.tasks.filter(
                            task =>
                                task.id !== id
                        );


                    this.saveToStorage();

                    this.renderTasks();

                    this.updateStats();


                    this.showFeedback(
                        'Task deleted! 🗑️'
                    );

                }

            }


            toggleComplete(id) {

                const task =
                    this.tasks.find(
                        t => t.id === id
                    );


                if (task) {

                    task.completed =
                        !task.completed;


                    this.saveToStorage();

                    this.renderTasks();

                    this.updateStats();


                    this.showFeedback(
                        task.completed
                            ? 'Task completed! 🎉'
                            : 'Task reopened! 📝'
                    );

                }

            }


            clearForm() {

                document
                    .getElementById(
                        'taskTitle'
                    )
                    .value = '';


                document
                    .getElementById(
                        'taskDescription'
                    )
                    .value = '';


                document
                    .getElementById(
                        'taskPriority'
                    )
                    .value = 'medium';


                document
                    .getElementById(
                        'taskDueDate'
                    )
                    .value = '';

            }


            getFilteredAndSortedTasks() {

                let filteredTasks =
                    [...this.tasks];


                const priorityFilter =
                    document
                        .getElementById(
                            'filterPriority'
                        )
                        .value;


                if (
                    priorityFilter !== 'all'
                ) {

                    filteredTasks =
                        filteredTasks.filter(
                            task =>
                                task.priority ===
                                priorityFilter
                        );

                }


                const sortBy =
                    document
                        .getElementById(
                            'sortBy'
                        )
                        .value;


                filteredTasks.sort(
                    (a, b) => {

                        switch (sortBy) {


                            case 'priority':

                                const priorityOrder = {

                                    high: 3,

                                    medium: 2,

                                    low: 1

                                };


                                return (
                                    priorityOrder[
                                        b.priority
                                    ] -
                                    priorityOrder[
                                        a.priority
                                    ]
                                );


                            case 'title':

                                return a.title.localeCompare(
                                    b.title
                                );


                            case 'dueDate':

                                if (
                                    !a.dueDate &&
                                    !b.dueDate
                                ) {

                                    return 0;

                                }


                                if (!a.dueDate) {

                                    return 1;

                                }


                                if (!b.dueDate) {

                                    return -1;

                                }


                                return (
                                    new Date(
                                        a.dueDate
                                    ) -
                                    new Date(
                                        b.dueDate
                                    )
                                );


                            case 'date':

                            default:

                                return (
                                    new Date(
                                        b.createdAt
                                    ) -
                                    new Date(
                                        a.createdAt
                                    )
                                );

                        }

                    }
                );


                return filteredTasks;

            }


            renderTasks() {

                const tasksList =
                    document.getElementById(
                        'tasksList'
                    );


                const tasks =
                    this.getFilteredAndSortedTasks();


                if (tasks.length === 0) {

                    tasksList.innerHTML =

                        '<div class="no-tasks">' +

                        'No tasks match your current filters. 🔍' +

                        '</div>';

                    return;

                }


                tasksList.innerHTML =

                    tasks.map(task => `

                        <div
                            class="task-item
                            ${task.priority}
                            ${task.completed ? 'completed' : ''}"
                        >


                            <div class="task-header">


                                <div class="task-title">

                                    ${this.escapeHtml(
                                        task.title
                                    )}

                                </div>


                                <div class="task-actions">


                                    <button
                                        class="task-btn complete-btn"
                                        onclick="todoApp.toggleComplete(${task.id})"
                                    >

                                        ${
                                            task.completed
                                                ? '↩️ Undo'
                                                : '✅ Complete'
                                        }

                                    </button>


                                    <button
                                        class="task-btn delete-btn"
                                        onclick="todoApp.deleteTask(${task.id})"
                                    >

                                        🗑️ Delete

                                    </button>


                                </div>


                            </div>


                            ${
                                task.description

                                    ? `

                                        <div
                                            style="
                                                color:#666;
                                                margin:10px 0;
                                                font-style:italic;
                                            "
                                        >

                                            ${this.escapeHtml(
                                                task.description
                                            )}

                                        </div>

                                    `

                                    : ''
                            }


                            <div class="task-meta">


                                <span
                                    class="priority-badge ${task.priority}"
                                >

                                    ${task.priority.toUpperCase()}

                                </span>


                                <span>

                                    ${
                                        task.dueDate

                                            ? `📅 Due:
                                                ${this.formatDate(
                                                    task.dueDate
                                                )}`

                                            : ''
                                    }


                                    ${
                                        task.dueDate
                                            ? ' | '
                                            : ''
                                    }


                                    Created:
                                    ${this.formatDate(
                                        task.createdAt
                                            .split('T')[0]
                                    )}

                                </span>


                            </div>


                        </div>

                    `).join('');

            }


            updateStats() {

                const total =
                    this.tasks.length;


                const completed =
                    this.tasks.filter(
                        t => t.completed
                    ).length;


                const pending =
                    total - completed;


                document
                    .getElementById(
                        'totalTasks'
                    )
                    .textContent = total;


                document
                    .getElementById(
                        'completedTasks'
                    )
                    .textContent = completed;


                document
                    .getElementById(
                        'pendingTasks'
                    )
                    .textContent = pending;

            }


            formatDate(dateString) {

                if (!dateString) {

                    return '';

                }


                const date =
                    new Date(
                        dateString
                    );


                return date.toLocaleDateString(
                    'en-US',
                    {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    }
                );

            }


            escapeHtml(text) {

                const div =
                    document.createElement(
                        'div'
                    );


                div.textContent = text;


                return div.innerHTML;

            }


            showFeedback(message) {

                const notification =
                    document.createElement(
                        'div'
                    );


                notification.style.cssText = `

                    position: fixed;

                    top: 20px;

                    right: 20px;

                    background: #27ae60;

                    color: white;

                    padding: 15px 25px;

                    border-radius: 10px;

                    z-index: 1000;

                    box-shadow:
                        0 5px 15px
                        rgba(0,0,0,0.3);

                    transform:
                        translateX(400px);

                    transition:
                        transform 0.3s ease;

                `;


                notification.textContent =
                    message;


                document.body.appendChild(
                    notification
                );


                setTimeout(
                    () => {

                        notification.style.transform =
                            'translateX(0)';

                    },
                    100
                );


                setTimeout(
                    () => {

                        notification.style.transform =
                            'translateX(400px)';


                        setTimeout(
                            () =>
                                notification.remove(),
                            300
                        );

                    },
                    2000
                );

            }


            saveToStorage() {

                localStorage.setItem(
                    'todoTasks',
                    JSON.stringify(
                        this.tasks
                    )
                );


                localStorage.setItem(
                    'todoCurrentId',
                    this.currentId.toString()
                );

            }

        }


        /* ================= INITIALIZE ================= */

        const todoApp =
            new TodoApp();


        /* ================= GLOBAL ADD FUNCTION ================= */

        function addTask() {

            todoApp.addTask();

        }

    </script>

</body>

</html>
